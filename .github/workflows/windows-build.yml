name: Windows x64 build validation
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Windows x64: verify localization, build, test and publish | PR #{0} | {1} -> {2}', github.event.pull_request.number, github.head_ref, github.base_ref)
      || format('Windows x64: verify localization, build, test and publish | {0} | {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    # Keep this on a public GitHub-hosted label. build.ps1 discovers the
    # installed Visual Studio and CMake instead of relying on a custom label.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python for USB touch bridge
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up MSYS2 UCRT64 for UxPlay
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Avoid a full MSYS2 mirror upgrade on every run. The action still
          # installs the pinned build dependencies below, while avoiding
          # unrelated mirror timeouts during database refresh.
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl

      - name: Restore pinned runtime files omitted from source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstreamCommit = '0e26a3f6b5079001d8920e552c329b2e6c97013e'

          $airPlayRoot = Join-Path $PWD 'third_party\airplay-server\bin\x64'
          New-Item -ItemType Directory -Force -Path $airPlayRoot | Out-Null
          foreach ($name in @(
            'airplay2dll.dll',
            'avcodec-58.dll',
            'avutil-56.dll',
            'dnssd.dll',
            'swresample-3.dll',
            'swscale-5.dll'
          )) {
            $url = "https://raw.githubusercontent.com/RayrenSX/iPhoneMirror/$upstreamCommit/third_party/airplay-server/bin/x64/$name"
            $destination = Join-Path $airPlayRoot $name
            & curl.exe -L --fail --retry 3 --retry-delay 2 --output $destination $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              throw "Could not restore AirPlay runtime file: $name"
            }
          }

          $manifest = Join-Path $PWD 'third_party\airplay-server\SHA256SUMS.txt'
          foreach ($line in Get-Content -LiteralPath $manifest) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s{2}bin/x64/(.+)$') {
              throw "Invalid AirPlay runtime manifest entry: $line"
            }
            $expected = $Matches[1].ToLowerInvariant()
            $path = Join-Path $airPlayRoot $Matches[2]
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "AirPlay runtime hash mismatch: $($Matches[2])" }
          }

          $libUsbRoot = Join-Path $PWD 'third_party\libusb\bin\x64'
          New-Item -ItemType Directory -Force -Path $libUsbRoot | Out-Null
          $libUsbDestination = Join-Path $libUsbRoot 'libusb-1.0.dll'
          $libUsbUrl = "https://raw.githubusercontent.com/RayrenSX/iPhoneMirror/$upstreamCommit/third_party/libusb/bin/x64/libusb-1.0.dll"
          & curl.exe -L --fail --retry 3 --retry-delay 2 --output $libUsbDestination $libUsbUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $libUsbDestination -PathType Leaf)) {
            throw 'Could not restore libusb-1.0.dll'
          }

      - name: Verify Simplified Chinese and English resources
        shell: pwsh
        run: ./scripts/verify_localization.ps1

      - name: Build Release, run tests, and publish Windows x64 output
        shell: pwsh
        run: ./build.ps1 -Configuration Release
