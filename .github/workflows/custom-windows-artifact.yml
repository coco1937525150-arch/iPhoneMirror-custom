name: Build custom Windows x64 artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up MSYS2 UCRT64 for UxPlay
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl

      - name: Restore binary runtime files omitted from source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $airPlayRoot = Join-Path $PWD 'third_party\airplay-server\bin\x64'
          New-Item -ItemType Directory -Force -Path $airPlayRoot | Out-Null
          $airPlayFiles = @(
            'airplay2dll.dll',
            'avcodec-58.dll',
            'avutil-56.dll',
            'dnssd.dll',
            'swresample-3.dll',
            'swscale-5.dll'
          )
          foreach ($name in $airPlayFiles) {
            $url = "https://raw.githubusercontent.com/RayrenSX/iPhoneMirror/main/third_party/airplay-server/bin/x64/$name"
            $destination = Join-Path $airPlayRoot $name
            Write-Host "Downloading $name"
            & curl.exe -L --fail --retry 3 --retry-delay 2 --output $destination $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $destination -PathType Leaf)) {
              throw "Could not restore AirPlay runtime file: $name"
            }
          }

          $manifest = Join-Path $PWD 'third_party\airplay-server\SHA256SUMS.txt'
          foreach ($line in Get-Content -LiteralPath $manifest) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s{2}bin/x64/(.+)$') {
              throw "Invalid AirPlay runtime manifest entry: $line"
            }
            $expected = $Matches[1].ToLowerInvariant()
            $name = $Matches[2]
            $path = Join-Path $airPlayRoot $name
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "AirPlay runtime hash mismatch for $name"
            }
          }

          $libUsbRoot = Join-Path $PWD 'third_party\libusb\bin\x64'
          New-Item -ItemType Directory -Force -Path $libUsbRoot | Out-Null
          $libUsbDestination = Join-Path $libUsbRoot 'libusb-1.0.dll'
          $libUsbUrl = 'https://raw.githubusercontent.com/RayrenSX/iPhoneMirror/main/third_party/libusb/bin/x64/libusb-1.0.dll'
          & curl.exe -L --fail --retry 3 --retry-delay 2 --output $libUsbDestination $libUsbUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $libUsbDestination -PathType Leaf)) {
            throw 'Could not restore libusb-1.0.dll'
          }
          $expectedLibUsbHash = '4c3c67ecf36270bfb796a5cbc4b3bf6931c0900c2fcbf12ebd808bd4c464b407'
          $actualLibUsbHash = (Get-FileHash -LiteralPath $libUsbDestination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualLibUsbHash -ne $expectedLibUsbHash) {
            throw "libusb-1.0.dll hash mismatch: $actualLibUsbHash"
          }

      - name: Build Release
        shell: pwsh
        run: ./build.ps1 -Configuration Release -SkipTests

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path outputs/iPhoneMirror/* -DestinationPath iPhoneMirror-custom-win-x64.zip -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneMirror-custom-win-x64
          path: iPhoneMirror-custom-win-x64.zip
          if-no-files-found: error
          retention-days: 14
